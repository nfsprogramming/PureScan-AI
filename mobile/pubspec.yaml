name: mobile
description: PureScan AI - Intelligent Food Ingredient Scanner
publish_to: none
version: 1.0.1+2
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  hive: ^2.2.3
  google_fonts: ^8.1.0
  supabase_flutter: ^2.15.0
  flutter_dotenv: ^6.0.1
  camera: ^0.12.0+1
  mobile_scanner: ^7.2.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  path_provider: ^2.1.2
  pdf: ^3.12.0
  printing: ^5.14.3
  timeago: ^3.7.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  flutter_local_notifications: ^22.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
flutter:
  uses-material-design: true
  assets:
  - .env
  - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_logo_monochrome.png"

flutter_native_splash:
  color: "#F8F9FA"
  color_dark: "#0F1412"
  image: "assets/images/app_logo.png"
  image_dark: "assets/images/app_logo.png"
  android_12:
    color: "#F8F9FA"
    color_dark: "#0F1412"
    image: "assets/images/app_logo.png"
    image_dark: "assets/images/app_logo.png"