version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: purescan_meilisearch
    environment:
      - MEILI_MASTER_KEY=purescan_super_secret_master_key
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  meilisearch_data:
