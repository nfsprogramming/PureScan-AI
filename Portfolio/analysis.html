<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .pulse-container {
      position: relative;
    }

    .pulse-ring {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid #3f6653;
      border-radius: 9999px;
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    .scan-line {
      height: 2px;
      background: linear-gradient(to right, transparent, #3f6653, transparent);
      width: 100%;
      position: absolute;
      top: 0;
      animation: scan-move 3s linear infinite;
    }

    @keyframes scan-move {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .floating-molecule {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    .fade-status {
      transition: opacity 0.5s ease-in-out;
    }
  </style>

</div>

<!-- Typography -->

        Analyzing Ingredients...
      </h1>
<div class="h-5 overflow-hidden mb-3">
<p class="font-label-md text-[11px] text-on-surface-variant fade-status uppercase tracking-wider font-semibold" id="status-text">
          Scanning ingredient labels...
        </p>
</div>
<!-- Progress Indicator -->
<div class="w-full max-w-[180px] h-1.5 bg-surface-container rounded-full overflow-hidden mb-4">
<div class="h-full bg-secondary-fixed-dim rounded-full transition-all duration-700 ease-out" id="progress-bar" style="width: 5%"></div>
</div>
<!-- Small Badge (Trust/Safety) -->

<span class="material-symbols-outlined text-secondary text-[16px]">verified_user</span>
<span class="font-label-sm text-[11px] font-semibold text-on-secondary-container">Encrypted AI Analysis</span>
</div>

</main>
<script>
    const statuses = [
      "Scanning ingredient labels...",
      "Cross-referencing FSSAI standards...",
      "Identifying chemical additives...",
      "Calculating safety scores...",
      "Fetching nutritional data...",
      "Finalizing AI summary..."
    ];

    let currentStatusIndex = 0;
    const statusEl = document.getElementById('status-text');
    const progressEl = document.getElementById('progress-bar');
    let progress = 5;

    // Cycle Status Text
    setInterval(() => {
      statusEl.style.opacity = '0';
      setTimeout(() => {
        currentStatusIndex = (currentStatusIndex + 1) % statuses.length;
        statusEl.textContent = statuses[currentStatusIndex];
        statusEl.style.opacity = '1';
      }, 500);
    }, 2500);

    // Increment Progress Bar slowly
    const progressInterval = setInterval(() => {
      if (progress < 95) {
        progress += Math.random() * 8;
        if (progress > 95) progress = 95;
        progressEl.style.width = `${progress}%`;
      }
    }, 1500);

    // Micro-interaction: React to mouse position slightly
    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const moveX = (e.clientX - centerX) / 50;
      const moveY = (e.clientY - centerY) / 50;
      
      const graphics = document.querySelectorAll('.floating-molecule');
      graphics.forEach(el => {
        el.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });
    });
  </script>
